[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ampidentifier"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "scipy",
    "xgboost>=1.6.0",
    "lightgbm>=4.0.0",
    "biopython",
    "modlamp",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

[project.scripts]
ampidentifier2 = "main:main"

[tool.setuptools.packages.find]
where = ["."]
