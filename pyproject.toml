[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ampidentifier"
version = "2.0.3"
description = "Sequence-based identification of antimicrobial peptides using physicochemical feature engineering and a soft-voting ensemble of five classifiers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Madson Allan de Luna-Aragão", email = "madsondeluna@gmail.com" },
    { name = "Rafael Lucas da Silva" },
    { name = "João Pacifico Bezerra Neto" },
    { name = "Carlos André dos Santos-Silva" },
    { name = "Denys Ewerton da Silva Santos" },
    { name = "Ana Maria Benko-Iseppon" },
]
keywords = [
    "antimicrobial peptides",
    "AMP prediction",
    "machine learning",
    "ensemble classifier",
    "physicochemical features",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "scipy",
    "xgboost>=1.6.0",
    "lightgbm>=4.0.0",
    "biopython",
    "modlamp",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/madsondeluna/AMPidentifier"
Repository = "https://github.com/madsondeluna/AMPidentifier"
"Bug Tracker" = "https://github.com/madsondeluna/AMPidentifier/issues"

[project.scripts]
ampidentifier = "amp_identifier.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
amp_identifier = ["models/*.pkl", "models/*.txt"]
webapp = ["data/*.json", "data/snapshots/*.json", "img/*.png", "img/*.jpeg",
          "img/pure/*.png", "img/pure/*.jpeg", "pure/*.css"]
